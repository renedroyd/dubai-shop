name: Quality

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} · Laravel tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, curl, fileinfo, pdo_sqlite, sqlite3, zip
          coverage: none
          tools: composer:v2
      - name: Validate Composer configuration
        run: composer validate --no-check-publish
      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Audit PHP dependencies
        run: composer audit --locked --no-interaction
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run test suite
        run: php artisan test
      - name: Verify production caches
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan config:clear
          php artisan route:clear
          php artisan view:clear

  frontend:
    name: Frontend assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, dom, curl, fileinfo, pdo_sqlite, sqlite3, zip
          coverage: none
          tools: composer:v2
      - name: Install PHP dependencies for Filament theme
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Audit PHP dependencies
        run: composer audit --locked --no-interaction
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit Node dependencies
        run: npm audit --audit-level=high
      - name: Build assets
        run: npm run build
