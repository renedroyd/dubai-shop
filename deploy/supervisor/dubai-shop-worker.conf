; Template for a persistent Laravel queue worker.
; Replace the application path, PHP binary and runtime user before installation.

[program:dubai-shop-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/dubai-shop/current/artisan queue:work database --sleep=3 --tries=3 --timeout=90
directory=/var/www/dubai-shop/current
user=www-data
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/dubai-shop-worker.log
stopwaitsecs=3600
